name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Setup and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: bun node go
          cache: true

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('cloudflare/workers/ogp-generate/package-lock.json', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Go packages
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('gcp/functions/**/go.sum', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('bun.lockb') }}-${{ hashFiles('src/**', 'scripts/**', 'next.config.*', 'postcss.config.*', 'open-next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('bun.lockb') }}-
            ${{ runner.os }}-next-

      - name: Set up repository
        run: mise run setup

      - name: Verify repository
        run: mise run verify
